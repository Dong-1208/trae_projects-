<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环保固废核算系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;font-size:14px;color:#303133}
.app{min-height:100vh;display:flex;flex-direction:column}
.header{background:#409eff;color:#fff;padding:16px 20px;border-bottom:1px solid #e6e6e6}
.header-content{display:flex;justify-content:space-between;align-items:center;max-width:1400px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px}
.title{font-size:18px;font-weight:600}
.date{font-size:14px;opacity:0.8}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:180px;background:#fff;border-right:1px solid #e6e6e6;padding:20px 0}
.menu{padding:12px 20px;cursor:pointer;color:#606266;transition:all 0.3s;border-left:3px solid transparent}
.menu:hover{background:#f2f6fc;color:#409eff}
.menu.active{background:#ecf5ff;color:#409eff;border-left-color:#409eff}
.content{flex:1;padding:20px;overflow-y:auto;background:#f5f7fa}
.dashboard{max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:20px}
.stat{background:#fff;border-radius:8px;padding:20px;display:flex;align-items:center;gap:15px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.stat-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.bg-blue{background:#ecf5ff;color:#409eff}
.bg-green{background:#f0f9eb;color:#67c23a}
.bg-orange{background:#fff7e6;color:#e6a23c}
.bg-red{background:#fef0f0;color:#f56c6c}
.stat-info{flex:1}
.stat-value{font-size:24px;font-weight:600;color:#303133}
.stat-label{font-size:14px;color:#909399;margin-top:4px}
.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:20px}
.chart{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.chart-title{font-size:16px;font-weight:600;color:#303133;margin-bottom:16px}
.pie{display:flex;flex-direction:column;gap:10px}
.pie-item{display:flex;align-items:center;gap:10px}
.pie-bar{height:20px;border-radius:4px;min-width:40px}
.pie-label{flex:1;font-size:14px;color:#606266}
.pie-value{font-size:14px;color:#909399}
.disposal{display:flex;flex-direction:column;gap:12px}
.disposal-item{display:flex;flex-direction:column;gap:6px}
.disposal-bar-wrap{height:16px;background:#f2f6fc;border-radius:8px;overflow:hidden}
.disposal-bar{height:100%;border-radius:8px}
.disposal-info{display:flex;justify-content:space-between;font-size:13px}
.disposal-label{color:#606266}
.disposal-value{color:#909399}
.table-wrap{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #ebeef5}
th{font-weight:600;color:#606266}
td{color:#303133}
.type-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px}
.type-tag生活垃圾{background:#f0f9eb;color:#67c23a}
.type-tag危险废物{background:#fef0f0;color:#f56c6c}
.type-tag建筑垃圾{background:#e6f7ff;color:#1890ff}
.type-tag工业废物{background:#fff7e6;color:#e6a23c}
.type-tag医疗废物{background:#f9f0ff;color:#9d4edd}
.type-tag农业废物{background:#e8f5e9;color:#43a047}
.type-tag电子废物{background:#fce4ec;color:#ec407a}
.type-tag餐饮废物{background:#fff3e0;color:#ff9800}
.type-tag包装废物{background:#e3f2fd;color:#2196f3}
.form-page{max-width:800px;margin:0 auto}
.page-header{margin-bottom:24px}
.page-title{font-size:24px;font-weight:600;color:#303133}
.page-desc{font-size:14px;color:#909399;margin-top:8px}
.form{background:#fff;border-radius:8px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:14px;font-weight:500;color:#606266}
.form-group input,.form-group select{padding:10px 12px;border:1px solid #dcdfe6;border-radius:4px;font-size:14px;color:#303133;outline:none;transition:border-color 0.3s}
.form-group input:focus,.form-group select:focus{border-color:#409eff}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.btn{padding:10px 20px;border:none;border-radius:4px;font-size:14px;cursor:pointer;transition:all 0.3s}
.btn-primary{background:#409eff;color:#fff}
.btn-primary:hover{background:#66b1ff}
.btn-default{background:#f5f7fa;color:#606266}
.btn-default:hover{background:#e4e7ed}
.search-bar{display:flex;gap:12px;margin-bottom:20px}
.search-input{flex:1;padding:10px 12px;border:1px solid #dcdfe6;border-radius:4px;font-size:14px}
.filter-select{padding:10px 12px;border:1px solid #dcdfe6;border-radius:4px;font-size:14px}
.action-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.table-actions{display:flex;gap:10px}
.btn-sm{padding:6px 12px;font-size:12px}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px}
.page-btn{width:36px;height:36px;border:1px solid #dcdfe6;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.page-btn.active{background:#409eff;color:#fff;border-color:#409eff}
.page-btn:hover:not(.active){background:#f5f7fa}
.report-page{max-width:1200px;margin:0 auto}
.report-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.year-select{padding:8px 12px;border:1px solid #dcdfe6;border-radius:4px;font-size:14px}
.line-chart{width:100%;height:300px;background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.line-chart svg{width:100%;height:100%}
.month-bars{display:flex;justify-content:space-between;align-items:flex-end;height:200px;padding:0 20px}
.month-bar{flex:1;margin:0 4px;background:#409eff;border-radius:4px 4px 0 0;position:relative}
.month-bar:hover{background:#66b1ff}
.month-bar-label{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);font-size:12px;color:#909399}
.month-bar-value{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:12px;color:#606266}
.type-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.type-stat{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.type-stat-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.type-stat-color{width:12px;height:12px;border-radius:50%}
.type-stat-name{font-weight:600;color:#303133}
.type-stat-value{font-size:24px;font-weight:600;color:#409eff}
.type-stat-label{font-size:14px;color:#909399}
.type-stat-percent{font-size:14px;color:#67c23a}
.budget-page{max-width:1200px;margin:0 auto}
.budget-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:20px}
.budget-card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.budget-card-title{font-size:14px;color:#909399;margin-bottom:8px}
.budget-card-value{font-size:24px;font-weight:600;color:#303133}
.budget-card-unit{font-size:14px;color:#909399;margin-left:4px}
.budget-charts{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:20px}
.progress-section{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.progress-title{font-size:16px;font-weight:600;color:#303133;margin-bottom:20px}
.progress-item{margin-bottom:16px}
.progress-header{display:flex;justify-content:space-between;margin-bottom:8px}
.progress-label{font-size:14px;color:#606266}
.progress-percent{font-size:14px;color:#409eff}
.progress-bar-wrap{height:12px;background:#f2f6fc;border-radius:6px;overflow:hidden}
.progress-bar{height:100%;background:#409eff;border-radius:6px;transition:width 0.3s}
.analysis-section{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.analysis-title{font-size:14px;color:#909399;margin-bottom:4px}
.analysis-value{font-size:20px;font-weight:600;color:#303133}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:12px 24px;border-radius:4px;font-size:14px;z-index:1000}
.toast.hidden{display:none}
.toast.success{background:rgba(103,194,58,0.9)}
.toast.error{background:rgba(245,108,108,0.9)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.hidden{display:none}
.modal{background:#fff;border-radius:8px;width:400px;overflow:hidden}
.modal-title{padding:16px;border-bottom:1px solid #ebeef5;font-size:16px;font-weight:600;color:#303133}
.modal-body{padding:20px;font-size:14px;color:#606266}
.modal-footer{padding:16px;border-top:1px solid #ebeef5;display:flex;justify-content:flex-end;gap:12px}
@media(max-width:768px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .charts{grid-template-columns:1fr}
    .form-row{grid-template-columns:1fr}
    .budget-cards{grid-template-columns:repeat(2,1fr)}
    .budget-charts{grid-template-columns:1fr}
    .type-stats{grid-template-columns:repeat(2,1fr)}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid #e6e6e6}
    .main{flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
<header class="header">
    <div class="header-content">
        <div class="logo">
            <svg class="logo-icon" viewBox="0 0 1024 1024"><path fill="#fff" d="M512 96c-229.8 0-416 186.2-416 416s186.2 416 416 416 416-186.2 416-416S741.8 96 512 96zm0 736c-176.5 0-320-143.5-320-320s143.5-320 320-320 320 143.5 320 320-143.5 320-320 320z"/></svg>
            <span class="title">环保固废核算系统</span>
        </div>
        <span class="date" id="currentDate"></span>
    </div>
</header>
<div class="main">
    <aside class="sidebar">
        <div class="menu active" data-menu="dashboard" onclick="setMenu('dashboard')">📊 数据概览</div>
        <div class="menu" data-menu="input" onclick="setMenu('input')">📝 数据录入</div>
        <div class="menu" data-menu="list" onclick="setMenu('list')">📋 记录查询</div>
        <div class="menu" data-menu="report" onclick="setMenu('report')">📈 统计报表</div>
        <div class="menu" data-menu="budget" onclick="setMenu('budget')">💰 成本预算</div>
    </aside>
    <main class="content" id="mainContent"></main>
</div>
</div>
<div id="toast" class="toast hidden"></div>
<div id="confirmModal" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-title">确认</div>
        <div class="modal-body" id="confirmMsg">确定要执行此操作吗？</div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="doConfirm()">确定</button>
        </div>
    </div>
</div>
<script>
var wasteTypes=[
    {name:'生活垃圾',categories:['厨余垃圾','塑料垃圾','纸张垃圾','金属垃圾','玻璃垃圾','其他']},
    {name:'危险废物',categories:['废油漆桶','废电池','废灯管','废溶剂','废化学品','其他']},
    {name:'建筑垃圾',categories:['废钢筋','废砖块','废混凝土','废木材','废塑料','其他']},
    {name:'工业废物',categories:['废渣','废酸','废碱','废油','废催化剂','其他']},
    {name:'医疗废物',categories:['感染性废物','病理性废物','损伤性废物','药物性废物','化学性废物']},
    {name:'农业废物',categories:['农作物秸秆','畜禽粪便','废弃农膜','农药包装','秸秆灰','其他']},
    {name:'电子废物',categories:['废弃电器','废旧电池','电路板','电子元件','废电线','其他']},
    {name:'餐饮废物',categories:['餐厨垃圾','食品残渣','废弃餐具','废油脂','一次性用品','其他']},
    {name:'包装废物',categories:['纸箱','塑料包装','泡沫塑料','金属包装','玻璃容器','其他']}
];
var wasteTypeList=['生活垃圾','危险废物','建筑垃圾','工业废物','医疗废物','农业废物','电子废物','餐饮废物','包装废物'];
var typeColors={'生活垃圾':'#91cc75','危险废物':'#ee6666','建筑垃圾':'#5470c6','工业废物':'#fac858','医疗废物':'#73c0de','农业废物':'#3ba272','电子废物':'#9a60b4','餐饮废物':'#ea7ccc','包装废物':'#39c5cf'};
var disposalMethods=['填埋','焚烧','回收利用','专业回收','堆肥','其他'];
var wasteSources=['办公楼','生产车间','施工工地','仓库','生活区','其他'];
var colors=['#5470c6','#91cc75','#fac858','#ee6666','#73c0de','#9a60b4'];
var costPerTon={'生活垃圾':120,'危险废物':800,'建筑垃圾':80,'工业废物':350,'医疗废物':500,'农业废物':60,'电子废物':450,'餐饮废物':100,'包装废物':90};
var records=sampleData.slice();
var currentMenu='dashboard';
var currentYear=new Date().getFullYear();
var selectedYear=currentYear-1;
var firstDataYear=2022;
var confirmFn=null;
var searchKeyword='';
var filterType='';
var currentPage=1;
var pageSize=10;
window.onload=function(){
    document.getElementById('currentDate').textContent=new Date().toLocaleDateString('zh-CN');
    renderDashboard();
}
function setMenu(m){
    currentMenu=m;
    document.querySelectorAll('.menu').forEach(function(el){
        el.classList.toggle('active',el.dataset.menu===m);
    });
    if(m==='dashboard')renderDashboard();
    else if(m==='input')renderInput();
    else if(m==='list')renderList();
    else if(m==='report')renderReport();
    else if(m==='budget')renderBudget();
}
function fmt(w){return w>=1000?(w/1000).toFixed(2)+' 吨':w.toFixed(2)+' kg';}
function fmtMoney(m){return m>=10000?(m/10000).toFixed(2)+' 万':m.toFixed(2)+' 元';}
function showToast(msg,type){
    var toast=document.getElementById('toast');
    toast.textContent=msg;
    toast.className='toast';
    if(type)toast.classList.add(type);
    toast.classList.remove('hidden');
    setTimeout(function(){toast.classList.add('hidden');},2000);
}
function showConfirm(msg,fn){
    document.getElementById('confirmMsg').textContent=msg;
    confirmFn=fn;
    document.getElementById('confirmModal').classList.remove('hidden');
}
function closeModal(){document.getElementById('confirmModal').classList.add('hidden');confirmFn=null;}
function doConfirm(){if(confirmFn)confirmFn();closeModal();}
function renderDashboard(){
    var total=records.reduce(function(s,r){return s+r.weight},0);
    var typeStats={};
    var disStats={};
    records.forEach(function(r){
        typeStats[r.type]=(typeStats[r.type]||0)+r.weight;
        disStats[r.disposalMethod]=(disStats[r.disposalMethod]||0)+r.weight;
    });
    var sortedTypes=Object.entries(typeStats).sort(function(a,b){return b[1]-a[1]});
    var html='<div class="dashboard">';
    html+='<div class="stats">';
    html+='<div class="stat"><div class="stat-icon bg-blue">📊</div><div class="stat-info"><div class="stat-value">'+fmt(total)+'</div><div class="stat-label">固废总量</div></div></div>';
    html+='<div class="stat"><div class="stat-icon bg-green">📝</div><div class="stat-info"><div class="stat-value">'+records.length+'</div><div class="stat-label">记录条数</div></div></div>';
    html+='<div class="stat"><div class="stat-icon bg-orange">🗂️</div><div class="stat-info"><div class="stat-value">'+Object.keys(typeStats).length+'</div><div class="stat-label">废物类型</div></div></div>';
    html+='<div class="stat"><div class="stat-icon bg-red">⚙️</div><div class="stat-info"><div class="stat-value">'+Object.keys(disStats).length+'</div><div class="stat-label">处置方式</div></div></div>';
    html+='</div>';
    html+='<div class="charts">';
    html+='<div class="chart"><h3 class="chart-title">废物类型分布</h3><div class="pie">';
    sortedTypes.slice(0,5).forEach(function(item,i){
        html+='<div class="pie-item"><div class="pie-bar" style="width:'+(item[1]/total*100)+'%;background:'+colors[i]+'"></div><span class="pie-label">'+item[0]+'</span><span class="pie-value">'+fmt(item[1])+'</span></div>';
    });
    html+='</div></div>';
    html+='<div class="chart"><h3 class="chart-title">处置方式分布</h3><div class="disposal">';
    Object.entries(disStats).forEach(function(item,i){
        html+='<div class="disposal-item"><div class="disposal-bar-wrap"><div class="disposal-bar" style="width:'+(item[1]/total*100)+'%;background:'+colors[i%colors.length]+'"></div></div><div class="disposal-info"><span class="disposal-label">'+item[0]+'</span><span class="disposal-value">'+fmt(item[1])+'</span></div></div>';
    });
    html+='</div></div></div>';
    html+='<div class="table-wrap"><h3 class="chart-title">最近记录</h3><table><thead><tr><th>日期</th><th>类型</th><th>类别</th><th>重量</th><th>来源</th><th>处置方式</th></tr></thead><tbody>';
    records.slice(0,5).forEach(function(r){
        html+='<tr><td>'+r.date+'</td><td><span class="type-tag type-tag'+r.type+'">'+r.type+'</span></td><td>'+r.category+'</td><td>'+r.weight+' kg</td><td>'+r.source+'</td><td>'+r.disposalMethod+'</td></tr>';
    });
    html+='</tbody></table></div></div>';
    document.getElementById('mainContent').innerHTML=html;
}
function renderInput(){
    var typeOptions='<option value="">请选择废物类型</option>';
    wasteTypes.forEach(function(t){typeOptions+='<option value="'+t.name+'">'+t.name+'</option>';});
    var sourceOptions='<option value="">请选择来源</option>';
    wasteSources.forEach(function(s){sourceOptions+='<option value="'+s+'">'+s+'</option>';});
    var disposalOptions='<option value="">请选择处置方式</option>';
    disposalMethods.forEach(function(m){disposalOptions+='<option value="'+m+'">'+m+'</option>';});
    var today=new Date().toISOString().split('T')[0];
    var html='<div class="form-page"><div class="page-header"><h2 class="page-title">固废数据录入</h2><p class="page-desc">请填写固废产生记录的详细信息</p></div>';
    html+='<div class="form"><div class="form-row"><div class="form-group"><label>日期 *</label><input type="date" id="fDate" value="'+today+'"></div>';
    html+='<div class="form-group"><label>废物类型 *</label><select id="fType" onchange="typeChange()">'+typeOptions+'</select></div></div>';
    html+='<div class="form-row"><div class="form-group"><label>废物类别 *</label><select id="fCategory"><option value="">请先选择废物类型</option></select></div>';
    html+='<div class="form-group"><label>重量(kg) *</label><input type="number" id="fWeight" placeholder="请输入重量" step="0.1" min="0"></div></div>';
    html+='<div class="form-row"><div class="form-group"><label>来源 *</label><select id="fSource">'+sourceOptions+'</select></div>';
    html+='<div class="form-group"><label>处置方式 *</label><select id="fDisposal">'+disposalOptions+'</select></div></div>';
    html+='<div class="form-row"><div class="form-group"><label>备注</label><input type="text" id="fRemark" placeholder="请输入备注信息"></div><div class="form-group"></div></div>';
    html+='<div class="form-actions"><button class="btn btn-primary" onclick="doSubmit()">保存记录</button><button class="btn btn-default" onclick="doReset()">重置</button></div></div></div>';
    document.getElementById('mainContent').innerHTML=html;
}
function typeChange(){
    var type=document.getElementById('fType').value;
    var cat=document.getElementById('fCategory');
    var categories=wasteTypes.find(function(t){return t.name===type});
    var options='<option value="">请选择废物类别</option>';
    if(categories){
        categories.categories.forEach(function(c){options+='<option value="'+c+'">'+c+'</option>';});
    }
    cat.innerHTML=options;
}
function doSubmit(){
    var date=document.getElementById('fDate').value;
    var type=document.getElementById('fType').value;
    var category=document.getElementById('fCategory').value;
    var weight=parseFloat(document.getElementById('fWeight').value);
    var source=document.getElementById('fSource').value;
    var disposal=document.getElementById('fDisposal').value;
    if(!date){showToast('请选择日期','error');return;}
    if(!type){showToast('请选择废物类型','error');return;}
    if(!category){showToast('请选择废物类别','error');return;}
    if(!weight||weight<=0){showToast('请输入有效重量','error');return;}
    if(!source){showToast('请选择来源','error');return;}
    if(!disposal){showToast('请选择处置方式','error');return;}
    var id=Date.now().toString();
    records.unshift({id:id,date:date,type:type,category:category,weight:weight,unit:'kg',source:source,disposalMethod:disposal,remark:document.getElementById('fRemark').value});
    doReset();
    showToast('保存成功','success');
}
function doReset(){
    document.getElementById('fDate').value=new Date().toISOString().split('T')[0];
    document.getElementById('fType').value='';
    document.getElementById('fCategory').innerHTML='<option value="">请先选择废物类型</option>';
    document.getElementById('fWeight').value='';
    document.getElementById('fSource').value='';
    document.getElementById('fDisposal').value='';
    document.getElementById('fRemark').value='';
}
function renderList(){
    renderListContent();
}
function renderListContent(){
    var filtered=records.filter(function(r){
        var matchKeyword=!searchKeyword||r.type.includes(searchKeyword)||r.category.includes(searchKeyword)||r.source.includes(searchKeyword)||r.remark.includes(searchKeyword);
        var matchType=!filterType||r.type===filterType;
        return matchKeyword&&matchType;
    });
    var totalPages=Math.ceil(filtered.length/pageSize);
    currentPage=Math.min(currentPage,totalPages)||1;
    var start=(currentPage-1)*pageSize;
    var end=start+pageSize;
    var pageData=filtered.slice(start,end);
    var typeOptions='<option value="">全部类型</option>';
    wasteTypeList.forEach(function(t){typeOptions+='<option value="'+t+'"'+(filterType===t?' selected':'')+'>'+t+'</option>';});
    var html='<div class="list-page">';
    html+='<div class="search-bar">';
    html+='<input type="text" class="search-input" id="searchInput" placeholder="搜索类型、类别、来源..." value="'+searchKeyword+'" onkeyup="onSearch()">';
    html+='<select class="filter-select" id="filterSelect" onchange="onFilter()">'+typeOptions+'</select>';
    html+='<button class="btn btn-primary" onclick="exportCSV()">导出CSV</button>';
    html+='</div>';
    html+='<div class="table-wrap"><table><thead><tr><th>日期</th><th>类型</th><th>类别</th><th>重量</th><th>来源</th><th>处置方式</th><th>备注</th><th>操作</th></tr></thead><tbody>';
    pageData.forEach(function(r){
        html+='<tr><td>'+r.date+'</td><td><span class="type-tag type-tag'+r.type+'">'+r.type+'</span></td><td>'+r.category+'</td><td>'+r.weight+' kg</td><td>'+r.source+'</td><td>'+r.disposalMethod+'</td><td>'+(r.remark||'-')+'</td><td><button class="btn btn-sm btn-default" onclick="doDelete(\''+r.id+'\')">删除</button></td></tr>';
    });
    if(pageData.length===0){
        html+='<tr><td colspan="8" style="text-align:center;padding:20px;color:#909399">暂无数据</td></tr>';
    }
    html+='</tbody></table></div>';
    html+='<div class="pagination">';
    html+='<div class="page-btn" onclick="changePage('+(currentPage-1)+')"'+(currentPage<=1?' style="opacity:0.5;cursor:not-allowed"':'')+'>上一页</div>';
    for(var i=1;i<=totalPages;i++){
        html+='<div class="page-btn'+(i===currentPage?' active':'')+'" onclick="changePage('+i+')">'+i+'</div>';
    }
    html+='<div class="page-btn" onclick="changePage('+(currentPage+1)+')"'+(currentPage>=totalPages?' style="opacity:0.5;cursor:not-allowed"':'')+'>下一页</div>';
    html+='</div></div>';
    document.getElementById('mainContent').innerHTML=html;
}
function onSearch(){
    searchKeyword=document.getElementById('searchInput').value;
    currentPage=1;
    renderListContent();
}
function onFilter(){
    filterType=document.getElementById('filterSelect').value;
    currentPage=1;
    renderListContent();
}
function changePage(p){
    if(p<1)return;
    var filtered=records.filter(function(r){
        var matchKeyword=!searchKeyword||r.type.includes(searchKeyword)||r.category.includes(searchKeyword)||r.source.includes(searchKeyword)||r.remark.includes(searchKeyword);
        var matchType=!filterType||r.type===filterType;
        return matchKeyword&&matchType;
    });
    var totalPages=Math.ceil(filtered.length/pageSize);
    if(p>totalPages)return;
    currentPage=p;
    renderListContent();
}
function doDelete(id){
    showConfirm('确定要删除这条记录吗？',function(){
        records=records.filter(function(r){return r.id!==id});
        showToast('删除成功','success');
        renderListContent();
    });
}
function exportCSV(){
    var header=['日期','废物类型','废物类别','重量(kg)','来源','处置方式','备注'];
    var rows=records.map(function(r){
        return [r.date,r.type,r.category,r.weight,r.source,r.disposalMethod,r.remark||''].map(function(cell){
            return '"'+cell+'"';
        }).join(',');
    });
    var csv=[header.join(','),...rows].join('\n');
    var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var link=document.createElement('a');
    link.href=url;
    link.download='固废记录_'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')+'.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast('导出成功','success');
}
function renderReport(){
    var yearOptions='';
    for(var y=firstDataYear;y<=currentYear;y++){
        yearOptions+='<option value="'+y+'"'+(y===selectedYear?' selected':'')+'>'+y+'年</option>';
    }
    var monthly=getMonthlyData(selectedYear);
    var typeStats=getTypeStats(selectedYear);
    var total=monthly.reduce(function(s,m){return s+m},0);
    var html='<div class="report-page">';
    html+='<div class="report-header"><h2 class="page-title">统计报表</h2><select class="year-select" id="yearSelect" onchange="onYearChange()">'+yearOptions+'</select></div>';
    html+='<div class="stats">';
    html+='<div class="stat"><div class="stat-icon bg-blue">📊</div><div class="stat-info"><div class="stat-value">'+fmt(total)+'</div><div class="stat-label">年度总量</div></div></div>';
    html+='<div class="stat"><div class="stat-icon bg-green">📈</div><div class="stat-info"><div class="stat-value">'+(total/12).toFixed(2)+' kg</div><div class="stat-label">月均量</div></div></div>';
    html+='<div class="stat"><div class="stat-icon bg-orange">🗂️</div><div class="stat-info"><div class="stat-value">'+Object.keys(typeStats).length+'</div><div class="stat-label">废物类型数</div></div></div>';
    html+='<div class="stat"><div class="stat-icon bg-red">📉</div><div class="stat-info"><div class="stat-value">'+Math.max(...monthly).toFixed(2)+' kg</div><div class="stat-label">最高月产量</div></div></div>';
    html+='</div>';
    html+='<div class="chart" style="margin-top:20px"><h3 class="chart-title">'+selectedYear+'年月度趋势</h3><div class="line-chart">';
    html+=drawLineChart(monthly);
    html+='</div></div>';
    html+='<div class="type-stats">';
    Object.entries(typeStats).forEach(function(item){
        html+='<div class="type-stat"><div class="type-stat-header"><div class="type-stat-color" style="background:'+(typeColors[item[0]]||'#409eff')+'"></div><span class="type-stat-name">'+item[0]+'</span></div><div class="type-stat-value">'+fmt(item[1])+'</div><div class="type-stat-label">占比</div><div class="type-stat-percent">'+((item[1]/total*100).toFixed(1))+'%</div></div>';
    });
    html+='</div></div>';
    document.getElementById('mainContent').innerHTML=html;
}
function getMonthlyData(year){
    var monthly=new Array(12).fill(0);
    records.forEach(function(r){
        if(r.date.startsWith(year+'')){
            var month=parseInt(r.date.split('-')[1])-1;
            if(month>=0&&month<12)monthly[month]+=r.weight;
        }
    });
    return monthly;
}
function getTypeStats(year){
    var stats={};
    records.forEach(function(r){
        if(r.date.startsWith(year+'')){
            stats[r.type]=(stats[r.type]||0)+r.weight;
        }
    });
    var sorted=Object.entries(stats).sort(function(a,b){return b[1]-a[1]});
    var result={};
    sorted.forEach(function(item){result[item[0]]=item[1]});
    return result;
}
function onYearChange(){
    selectedYear=parseInt(document.getElementById('yearSelect').value);
    renderReport();
}
function drawLineChart(data){
    var months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    var maxVal=Math.max(...data,1);
    var chartWidth=600;
    var chartHeight=220;
    var padding=40;
    var width=chartWidth-padding*2;
    var height=chartHeight-padding*2;
    var stepX=width/11;
    var stepY=height/maxVal;
    var points=data.map(function(v,i){
        return {x:padding+i*stepX,y:chartHeight-padding-v*stepY};
    });
    var pathD='M '+points[0].x+' '+points[0].y;
    points.forEach(function(p){pathD+=' L '+p.x+' '+p.y});
    var areaD=pathD+' L '+points[points.length-1].x+' '+(chartHeight-padding)+' L '+points[0].x+' '+(chartHeight-padding)+' Z';
    var html='<svg viewBox="0 0 '+chartWidth+' '+chartHeight+'">';
    for(var i=0;i<=5;i++){
        var y=padding+i*(height/5);
        html+='<line x1="'+padding+'" y1="'+y+'" x2="'+(chartWidth-padding)+'" y2="'+y+'" stroke="#ebeef5" stroke-width="1"/>';
        html+='<text x="'+(padding-8)+'" y="'+(y+4)+'" font-size="10" fill="#909399" text-anchor="end">'+(maxVal-(maxVal/5*i)).toFixed(0)+'</text>';
    }
    points.forEach(function(p,i){
        html+='<line x1="'+p.x+'" y1="'+(chartHeight-padding)+'" x2="'+p.x+'" y2="'+(chartHeight-padding+5)+'" stroke="#ebeef5" stroke-width="1"/>';
        html+='<text x="'+p.x+'" y="'+(chartHeight-10)+'" font-size="10" fill="#909399" text-anchor="middle">'+months[i]+'</text>';
    });
    html+='<path d="'+areaD+'" fill="url(#gradient)" opacity="0.3"/>';
    html+='<defs><linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#409eff"/><stop offset="100%" stop-color="#fff"/></linearGradient></defs>';
    html+='<path d="'+pathD+'" fill="none" stroke="#409eff" stroke-width="2"/>';
    points.forEach(function(p){
        html+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#fff" stroke="#409eff" stroke-width="2"/>';
    });
    html+='</svg>';
    return html;
}
function renderBudget(){
    var currentYearData=getMonthlyData(currentYear-1);
    var lastYearData=getMonthlyData(currentYear-2);
    var currentYearTotal=currentYearData.reduce(function(s,m){return s+m},0);
    var lastYearTotal=lastYearData.reduce(function(s,m){return s+m},0);
    var emissionTarget=lastYearTotal*0.9;
    var emissionReduction=lastYearTotal-currentYearTotal;
    var emissionRate=lastYearTotal>0?(emissionReduction/lastYearTotal*100).toFixed(1):0;
    var costEstimate=calculateCost(currentYear-1);
    var lastYearCost=calculateCost(currentYear-2);
    var costReduction=lastYearCost-costEstimate;
    var costReductionRate=lastYearCost>0?(costReduction/lastYearCost*100).toFixed(1):0;
    var disposalBudget=300000;
    var budgetUsageRate=(costEstimate/disposalBudget*100).toFixed(1);
    var typeCostStats=calculateTypeCost(currentYear-1);
    var emissionProgress=Math.min((emissionReduction/(lastYearTotal-emissionTarget)*100),100).toFixed(0);
    var costProgress=Math.min((costReduction/50000*100),100).toFixed(0);
    var html='<div class="budget-page">';
    html+='<div class="page-header"><h2 class="page-title">成本预算管理</h2><p class="page-desc">减排量预算、预估成本及成本减少分析</p></div>';
    html+='<div class="budget-cards">';
    html+='<div class="budget-card"><div class="budget-card-title">年度减排量</div><div class="budget-card-value">'+fmt(emissionReduction)+'<span class="budget-card-unit"></span></div><div class="type-stat-percent">较上年减少 '+emissionRate+'%</div></div>';
    html+='<div class="budget-card"><div class="budget-card-title">预估处理成本</div><div class="budget-card-value">¥'+fmtMoney(costEstimate)+'</div><div class="type-stat-percent">较上年减少 '+costReductionRate+'%</div></div>';
    html+='<div class="budget-card"><div class="budget-card-title">成本减少金额</div><div class="budget-card-value">¥'+fmtMoney(costReduction)+'</div><div class="type-stat-percent">累计节约</div></div>';
    html+='<div class="budget-card"><div class="budget-card-title">预算使用进度</div><div class="budget-card-value">'+budgetUsageRate+'%</div><div class="type-stat-percent">年度预算 ¥30万</div></div>';
    html+='</div>';
    html+='<div class="budget-charts">';
    html+='<div class="progress-section"><h3 class="progress-title">年度目标进度</h3>';
    html+='<div class="progress-item"><div class="progress-header"><span class="progress-label">减排目标完成</span><span class="progress-percent">'+emissionProgress+'%</span></div><div class="progress-bar-wrap"><div class="progress-bar" style="width:'+emissionProgress+'%"></div></div></div>';
    html+='<div class="progress-item"><div class="progress-header"><span class="progress-label">成本控制目标</span><span class="progress-percent">'+costProgress+'%</span></div><div class="progress-bar-wrap"><div class="progress-bar" style="width:'+costProgress+'%"></div></div></div>';
    html+='</div>';
    html+='<div class="analysis-section"><h3 class="progress-title">成本减少分析</h3>';
    html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px">';
    html+='<div><div class="analysis-title">累计成本节约</div><div class="analysis-value">¥'+fmtMoney(costReduction)+'</div></div>';
    html+='<div><div class="analysis-title">累计减排量</div><div class="analysis-value">'+fmt(emissionReduction)+'</div></div>';
    html+='<div><div class="analysis-title">单位减排成本</div><div class="analysis-value">¥'+(emissionReduction>0?(costReduction/(emissionReduction/1000)).toFixed(2):0)+'/吨</div></div>';
    html+='</div></div>';
    html+='</div>';
    html+='<div class="table-wrap"><h3 class="chart-title">废物类型成本核算</h3><table><thead><tr><th>废物类型</th><th>处理量</th><th>单位成本(元/吨)</th><th>预估成本</th><th>占比</th></tr></thead><tbody>';
    Object.entries(typeCostStats).forEach(function(item){
        var percent=(item[1].cost/costEstimate*100).toFixed(1);
        html+='<tr><td><span class="type-tag type-tag'+item[0]+'">'+item[0]+'</span></td><td>'+fmt(item[1].weight)+'</td><td>¥'+costPerTon[item[0]]+'</td><td>¥'+item[1].cost.toFixed(2)+'</td><td>'+percent+'%</td></tr>';
    });
    html+='</tbody></table></div></div>';
    document.getElementById('mainContent').innerHTML=html;
}
function calculateCost(year){
    var total=0;
    records.forEach(function(r){
        if(r.date.startsWith(year+'')){
            total+=r.weight/1000*(costPerTon[r.type]||100);
        }
    });
    return total;
}
function calculateTypeCost(year){
    var stats={};
    records.forEach(function(r){
        if(r.date.startsWith(year+'')){
            if(!stats[r.type])stats[r.type]={weight:0,cost:0};
            stats[r.type].weight+=r.weight;
            stats[r.type].cost+=r.weight/1000*(costPerTon[r.type]||100);
        }
    });
    var sorted=Object.entries(stats).sort(function(a,b){return b[1].cost-a[1].cost});
    var result={};
    sorted.forEach(function(item){result[item[0]]=item[1]});
    return result;
}
</script>
